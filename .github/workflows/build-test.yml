name: build & test
on:
  push:
    branches: main
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.0'
      - name: Verify generated SDK is current
        shell: bash
        run: |
          make generate
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Generated SDK is stale. Run make generate and commit the changes."
            git status --short
            git diff
            exit 1
          fi
      - name: build
        shell: bash
        run: |
          make build
      - name: test
        shell: bash
        run: |
          make test
        env:
          KITTYCAD_API_TOKEN: ${{secrets.KITTYCAD_API_TOKEN}}
      - name: lint
        shell: bash
        run: |
          go get golang.org/x/lint/golint
          make lint
      - name: vet
        shell: bash
        run: |
          make vet
      - name: fmt
        shell: bash
        run: |
          make fmt
      - name: make test coverage
        shell: bash
        run: |
          make cover
        env:
          KITTYCAD_API_TOKEN: ${{secrets.KITTYCAD_API_TOKEN}}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: unittests
          files: ${{ github.workspace }}/coverage.txt
          verbose: true
